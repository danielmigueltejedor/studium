name: Studium
options:
  bundleIdPrefix: app.studium
  deploymentTarget:
    iOS: '17.5'
targets:
  Studium:
    type: application
    platform: iOS
    sources: [Studium]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.studium.study
        TARGETED_DEVICE_FAMILY: '2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: '5.0'
