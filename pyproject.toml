[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "studium"
version = "1.0.0a1"
description = "Fail-closed workflow for writing a rigorous academic book."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
studium = "studium.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
