name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra texlive-latex-recommended texlive-fonts-recommended texlive-lang-spanish texlive-lang-european texlive-lang-french texlive-lang-portuguese texlive-lang-italian poppler-utils
      - name: Install
        run: |
          uv export --frozen --extra dev --no-emit-project --output-file "${RUNNER_TEMP}/requirements.txt"
          python -m pip install --only-binary :all: --require-hashes -r "${RUNNER_TEMP}/requirements.txt"
          python -m pip install --only-binary :all: --no-deps .
      - name: Ruff
        run: ruff check src tests
      - name: Pyright
        run: pyright
      - name: Test with coverage
        run: |
          python -m pytest -q --cov=studium --cov-report=term-missing