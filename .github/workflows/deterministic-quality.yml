name: Deterministic Quality Gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify patch whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          else
            git show --format= --check HEAD
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Static analysis
        run: ruff check .
      - name: Tests and minimum branch-aware coverage
        run: python -m pytest --cov=studium --cov-branch --cov-report=term-missing --cov-fail-under=75
